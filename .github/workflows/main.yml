name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Enable Remote Desktop
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          Set-LocalUser -Name "runneradmin" -Password $securePassword
          Enable-LocalUser -Name "runneradmin"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService"

          Write-Host "RDP enabled successfully."

      - name: Show Connection Information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "WINDOWS RDP IS READY"
          Write-Host "======================================"
          Write-Host "Tailscale IPv4:"
          tailscale ip -4
          Write-Host ""
          Write-Host "RDP Username: runneradmin"
          Write-Host "RDP Password: The password stored in RDP_PASSWORD secret"
          Write-Host "======================================"

      - name: Keep RDP Online
        shell: powershell
        run: |
          Write-Host "RDP session is running..."
          Start-Sleep -Seconds 19800
